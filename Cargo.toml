[workspace]

members = [ "adm", "client", "daemon", "xtask" ]

resolver = "2"

[workspace.dependencies]

# intra-package dependencies
common = { path = "common" }
pumpkind-client = { path = "client" }

# public dependencies from crates.io
anyhow = "1.0"
camino = { version = "1.1", features = ["serde1"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
colored = "2"
dropshot = "0.15.1"
expectorate = "1"
futures = "0.3"
http = "0.2.9"
libc = "0.2"
omicron-zone-package = "0.12"
progenitor = "0.9.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false }
rmp-serde = "1.1"
schemars = "0.8"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = [ "futures-v0_3" ] }
slog = { version = "2.7", features = [ "release_max_level_debug", "max_level_trace" ] }
slog-async = "2.6"
slog-bunyan = "2.4"
slog-term = "2.6"
tabwriter = { version = "1", features = ["ansi_formatting"] }
tokio = "1.24"

# oxide dependencies from github
network-interface = { git = "https://github.com/oxidecomputer/network-interface", branch = "illumos", version = "0.1.7" }
